<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss — fall into the bulb</title>
<meta name="description" content="A raymarched Mandelbulb fractal orbiting on your GPU, in the browser. Move to steer the light. WebGL2, no server, no dependencies.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#030308; --panel:rgba(8,10,20,.55); --stroke:rgba(150,160,220,.14);
    --text:#e9edf8; --muted:#7a869e; --acc:#818cf8;
    --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--sans)}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:move}
  .overlay{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3.2vw,38px)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:9px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:p 2.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  h1{font-size:clamp(38px,8.5vw,120px);font-weight:200;letter-spacing:.13em;margin:10px 0 0;line-height:.98;text-wrap:balance;text-shadow:0 0 40px rgba(129,140,248,.14)}
  .tag{margin:13px 0 0;color:var(--muted);font-size:clamp(13px,1.5vw,16px);max-width:38ch;line-height:1.5}
  .bar{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);border-radius:14px;padding:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:fit-content;max-width:100%}
  button{font:500 13px var(--sans);color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:9px;padding:9px 13px;cursor:pointer;transition:background .18s,border-color .18s,transform .05s}
  button:hover{background:rgba(255,255,255,.09);border-color:rgba(150,160,220,.3)}
  button:active{transform:translateY(1px)}
  button[aria-pressed="true"]{background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.55);color:#fff}
  .meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:0 6px;text-transform:uppercase;white-space:nowrap}
  .fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px}
  .fallback.on{display:grid}
  .fallback .card{max-width:44ch}
  .fallback h2{font-weight:300;letter-spacing:.06em}
  .fallback p{color:var(--muted);line-height:1.6}
  .fallback code{font-family:var(--mono);font-size:13px}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <div>
    <div class="eyebrow"><span class="dot"></span>Live raymarched fractal &middot; WebGL2</div>
    <h1>ABYSS</h1>
    <p class="tag">A Mandelbulb rendered one ray at a time on your GPU. Move to steer the orbit and the light.</p>
  </div>
  <div class="bar" role="toolbar" aria-label="Fractal controls">
    <span class="meta" id="fps">-- fps</span>
    <button data-pal="0" aria-pressed="true">Abyss</button>
    <button data-pal="1" aria-pressed="false">Ember</button>
    <button data-pal="2" aria-pressed="false">Ultraviolet</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
</div>
<div class="fallback" id="fallback">
  <div class="card">
    <h2>No WebGL2 canvas</h2>
    <p>This experiment needs WebGL2. Open it in a recent Chrome, Edge, Safari, or Firefox and the bulb will appear.</p>
  </div>
</div>
<script>
'use strict';
/* Abyss: a Mandelbulb raymarcher on the visitor GPU.
 * One fullscreen triangle, one fragment shader: distance-estimated
 * marching, tetrahedron normals, cosine-palette shading, hashed stars.
 * The camera orbits on its own; the pointer steers orbit and light. */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false, alpha: false });
if (!gl) {
  document.getElementById('fallback').classList.add('on');
} else {
  main();
}

function main() {
  const PALS = [
    { a: [0.45, 0.50, 0.55], b: [0.40, 0.42, 0.45], c: [1.00, 1.00, 1.00], d: [0.00, 0.10, 0.20] },
    { a: [0.55, 0.30, 0.15], b: [0.45, 0.35, 0.30], c: [1.00, 1.00, 1.00], d: [0.00, 0.15, 0.25] },
    { a: [0.40, 0.25, 0.55], b: [0.45, 0.40, 0.45], c: [1.00, 1.00, 1.00], d: [0.75, 0.35, 0.10] },
  ];
  let pal = 0, paused = false, t0 = 0, simT = 0;
  let px = 0, py = 0, tx = 0, ty = 0;

  const VS = `#version 300 es
  layout(location=0) in vec2 aPos; out vec2 vUv;
  void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;
  const FS = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 o;
  uniform vec2 uRes; uniform float uT; uniform vec2 uPtr;
  uniform vec3 uPa, uPb, uPc, uPd;

  float mbDE(vec3 pos){
    vec3 z = pos;
    float dr = 1.0, r = 0.0;
    for(int i=0;i<9;i++){
      r = max(length(z), 1e-4);
      if(r > 2.0) break;
      float th = acos(clamp(z.z/r, -1.0, 1.0))*8.0;
      float ph = atan(z.y, z.x)*8.0;
      dr = pow(r, 7.0)*8.0*dr + 1.0;
      float zr = pow(r, 8.0);
      z = zr*vec3(sin(th)*cos(ph), sin(ph)*sin(th), cos(th)) + pos;
    }
    return 0.5*log(max(r, 1e-4))*max(r, 1e-4)/max(dr, 1e-4);
  }
  vec3 pal(float t){ return uPa + uPb*cos(6.2831853*(uPc*t + uPd)); }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }

  void main(){
    vec2 uv = (2.0*vUv - 1.0);
    uv.x *= uRes.x/uRes.y;
    float ang = uT*0.07 + uPtr.x*0.9;
    float rad = 2.45 + 0.30*sin(uT*0.045);
    vec3 ro = vec3(rad*sin(ang), 0.38 + uPtr.y*0.55, rad*cos(ang));
    vec3 ta = vec3(0.0, 0.05*sin(uT*0.06), 0.0);
    vec3 fw = normalize(ta - ro);
    vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
    vec3 up = cross(rt, fw);
    vec3 rd = normalize(uv.x*rt + uv.y*up + 1.7*fw);

    float t = 0.0, glow = 0.0, iter = 0.0;
    float hit = -1.0;
    for(int i=0;i<90;i++){
      vec3 p = ro + rd*t;
      float d = mbDE(p);
      glow = glow*0.93 + exp(-30.0*abs(d))*0.05;
      if(d < 0.0012*t + 0.0004){ hit = t; iter = float(i); break; }
      t += d*0.85;
      if(t > 6.0) break;
    }
    vec3 col;
    if(hit > 0.0){
      vec3 p = ro + rd*hit;
      float e = 0.0015;
      vec3 n = normalize(vec3(
        mbDE(p+vec3(e,0.,0.)) - mbDE(p-vec3(e,0.,0.)),
        mbDE(p+vec3(0.,e,0.)) - mbDE(p-vec3(0.,e,0.)),
        mbDE(p+vec3(0.,0.,e)) - mbDE(p-vec3(0.,0.,e))));
      vec3 ld = normalize(vec3(0.6+uPtr.x*0.5, 0.7, 0.5-uPtr.y*0.4));
      float dif = clamp(dot(n, ld), 0.0, 1.0);
      float spec = pow(clamp(dot(reflect(-ld, n), -rd), 0.0, 1.0), 28.0);
      float ao = 1.0 - iter/90.0*0.55;
      col = pal(0.12 + 0.35*n.y*0.5 + 0.30*n.x*0.5 + hit*0.10);
      col = col*(0.20 + 0.80*dif)*ao + spec*vec3(1.0, 0.96, 0.90)*0.7;
      col += pal(0.55)*glow*0.6;
      col = mix(col, vec3(0.012, 0.012, 0.030), 1.0 - exp(-hit*0.30));
    } else {
      col = vec3(0.012, 0.012, 0.030);
      vec3 q = rd*230.0;
      vec3 cell = floor(q);
      float on = step(0.978, hash(cell.xy + cell.z*17.0));
      float dstar = length(fract(q) - 0.5);
      float s = on*smoothstep(0.22, 0.02, dstar);
      col += vec3(0.8, 0.85, 1.0)*s*(0.25 + 0.35*hash(cell.xy + 7.0));
      col += pal(0.75)*glow*0.35;
    }
    float vig = smoothstep(1.45, 0.35, length(2.0*vUv - 1.0)*0.85);
    o = vec4(col*(0.45 + 0.55*vig), 1.0);
  }`;

  const v = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v, VS); gl.compileShader(v);
  const f = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f, FS); gl.compileShader(f);
  if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(f));
  const pr = gl.createProgram();
  gl.attachShader(pr, v); gl.attachShader(pr, f);
  gl.bindAttribLocation(pr, 0, 'aPos'); gl.linkProgram(pr);
  gl.useProgram(pr);
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = (n) => gl.getUniformLocation(pr, n);

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize); resize();

  addEventListener('pointermove', (e) => {
    tx = (e.clientX / innerWidth) * 2 - 1;
    ty = -((e.clientY / innerHeight) * 2 - 1);
  });
  addEventListener('pointerdown', (e) => {
    tx = (e.clientX / innerWidth) * 2 - 1;
    ty = -((e.clientY / innerHeight) * 2 - 1);
  });

  document.querySelectorAll('[data-pal]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-pal]').forEach((o) => o.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    pal = +b.dataset.pal;
  }));
  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => {
    paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });
  document.getElementById('reset').addEventListener('click', () => {
    simT = 0; tx = 0; ty = 0; px = 0; py = 0;
  });

  const fpsEl = document.getElementById('fps');
  let last = performance.now(), fpsA = 60, lastFps = 0;
  t0 = last;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = now - last; last = now;
    if (dt <= 0) return;
    fpsA += ((1000 / dt) - fpsA) * 0.05;
    if (now - lastFps > 500) { fpsEl.textContent = Math.round(fpsA) + ' fps'; lastFps = now; }
    if (!paused) simT += Math.min(dt, 100) / 1000;
    px += (tx - px) * 0.04;
    py += (ty - py) * 0.04;
    const P = PALS[pal];
    gl.uniform2f(U('uRes'), canvas.width, canvas.height);
    gl.uniform1f(U('uT'), simT);
    gl.uniform2f(U('uPtr'), px, py);
    gl.uniform3fv(U('uPa'), P.a);
    gl.uniform3fv(U('uPb'), P.b);
    gl.uniform3fv(U('uPc'), P.c);
    gl.uniform3fv(U('uPd'), P.d);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
